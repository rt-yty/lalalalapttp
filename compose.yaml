services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travel
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel_local_demo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      DATABASE_URL: postgresql://travel:${POSTGRES_PASSWORD:-travel_local_demo}@postgres:5432/travel
      AGENT_MODEL_BACKEND: ${COMPOSE_MODEL_BACKEND:-rules}
      AGENT_DATA_MODE: ${COMPOSE_DATA_MODE:-replay}
      AGENT_CHECKOUT_MODE: disabled
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_MAPS_EMBED_API_KEY: ${GOOGLE_MAPS_EMBED_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL_ID: ${HF_MODEL_ID:-}
      HF_INFERENCE_PROVIDER: ${HF_INFERENCE_PROVIDER:-auto}
      YANDEX_SEARCH_API_KEY: ${YANDEX_SEARCH_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
